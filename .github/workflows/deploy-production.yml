name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy AL MARE
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production release
        run: npm run build

      - name: Package runtime files
        run: |
          tar -czf almare-release.tgz \
            dist \
            package.json \
            package-lock.json \
            scripts/booking-form-monitor.mjs

      - name: Configure restricted SSH client
        env:
          DEPLOY_KEY: ${{ secrets.ALMARE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALMARE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/almare_deploy
          chmod 600 ~/.ssh/almare_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload verified release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          scp \
            -i ~/.ssh/almare_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            almare-release.tgz \
            "almare-deploy@194.67.103.68:/home/almare-deploy/incoming/${COMMIT_SHA}.tgz"

      - name: Activate release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/almare_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            almare-deploy@194.67.103.68 \
            "sudo /usr/local/sbin/almare-deploy ${COMMIT_SHA}"

      - name: Verify public website
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 6 \
            --retry-delay 5 \
            --retry-all-errors \
            https://hotel-almare.ru/probe
